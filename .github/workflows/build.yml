name: Build ALEX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compile
        run: |
          cl /nologo /std:c++17 /EHsc /DUNICODE /D_UNICODE main.cpp /link /SUBSYSTEM:WINDOWS Ole32.lib Comdlg32.lib User32.lib Gdi32.lib /OUT:ALEX.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ALEX-Windows
          path: ALEX.exe
